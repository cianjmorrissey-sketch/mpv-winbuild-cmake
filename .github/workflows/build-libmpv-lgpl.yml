# =============================================================================
# LGPL libmpv build for Performx (Route A - GitHub Actions)
#
# PLACE THIS FILE in a fork of https://github.com/shinchiro/mpv-winbuild-cmake
# as .github/workflows/build-libmpv-lgpl.yml and run it manually (Actions tab,
# "Run workflow"). It never runs automatically.
#
# WHAT IT PRODUCES
#   artifact libmpv-lgpl-x86_64               libmpv-2.dll (the LGPL build)
#   artifact libmpv-lgpl-corresponding-source the EXACT source trees the build
#                                             consumed, plus the build scripts -
#                                             the LGPL corresponding-source
#                                             bundle that must be hosted for as
#                                             long as the dll is distributed.
#   artifact build-failure-logs               (failed runs only) the inner
#                                             ExternalProject logs - every
#                                             failure must be diagnosable from
#                                             this download alone.
#
# TOOLCHAIN STRATEGY (mirrors upstream's live mpv_gcc.yml)
#   Upstream does NOT build the gcc cross toolchain from scratch per run: it
#   restores the whole build_$BIT tree from actions/cache (restore-key prefix
#   fallback to the newest previous cache), builds gcc ONLY when
#   build_$BIT/install/bin/cross-gcc is missing, deletes the intermediate
#   build_$BIT/toolchain directory after a successful gcc build, and saves the
#   cache at the end of EVERY run (success or failure). The same pattern is
#   used for src_packages and clang_root. This workflow adopts that verbatim:
#   the FIRST run pays the from-scratch toolchain build (an hour plus); later
#   runs restore it in seconds. If a cold gcc build fails, the failure-logs
#   artifact carries the inner log; a re-run after a fix resumes from whatever
#   the always-saved cache kept.
#
#   CACHE_VERSION below is this workflow's copy of upstream's cache-busting
#   secret: bump it to force everything cold - INCLUDING after changing the
#   scrub flags, so no stale dependency build tree configured with the old
#   flags can linger (the verify step would catch a GPL leak regardless, but
#   a clean rebuild avoids ever tripping it).
#
# WHY THE SCRUB STEP EXISTS
#   Upstream mpv-winbuild-cmake HARDCODES a GPL configuration:
#     packages/ffmpeg.cmake passes --enable-gpl --enable-version3
#       --enable-libx264 --enable-libx265 (plus other GPL-only libraries)
#       with no CMake option to turn them off;
#     packages/mpv.cmake passes no -Dgpl= option (mpv's meson default is
#       gpl=true, a GPL build) and enables rubberband and dvdnav (GPL-2.0).
#   This workflow rewrites those two files before configuring, then VERIFIES
#   the resulting binary. FFmpeg's own configure is the backstop: it refuses
#   to enable any GPL-only library without --enable-gpl, so a GPL dependency
#   this scrub misses fails the build loudly instead of shipping silently.
# =============================================================================

name: build-libmpv-lgpl

on:
  workflow_dispatch:   # manual only - this is a deliberate, occasional build

env:
  # Bump to invalidate every cache (upstream keeps this in a secret;
  # a plain string does the same job in the fork).
  # BUMP THIS whenever any toolchain flag changes - a restored config.cache
  # rejects changed flags ("CXXFLAGS has changed since the previous run").
  # ALSO bump after changing SCRUB flags: the cache stores the whole
  # build_$BIT tree, including generated ExternalProject configure
  # commands - a stale tree runs the OLD flags no matter what the
  # scrubbed source says (libdavs2 bit exactly this way at v4).
  CACHE_VERSION: lgpl-v7

jobs:
  build:
    runs-on: ubuntu-latest
    # Upstream's own build container (toolchain deps preinstalled). Public
    # image; forks can pull it unchanged.
    container: ghcr.io/shinchiro/archlinux:latest
    env:
      BIT: "64"
      ARCH: x86_64

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # LGPL scrub. Every line here is licence-relevant:
      #
      #   --enable-gpl        REMOVED: flips the whole FFmpeg build to GPL-2.0.
      #                       Without it FFmpeg is LGPL-2.1+.
      #   --enable-version3   REMOVED: upgrades LGPL-2.1 to LGPL-3.0 (and GPL2
      #                       to GPL3). Performx ships under LGPL-2.1 notices,
      #                       so stay on 2.1. Any library that REQUIRES v3
      #                       will now fail configure - remove that library.
      #   --enable-nonfree    not present upstream, scrubbed defensively:
      #                       would make the binary UNREDISTRIBUTABLE outright.
      #   --enable-libx264    REMOVED: x264 is GPL-2.0. H.264 DECODING remains
      #                       (FFmpeg's native decoder is LGPL); only x264
      #                       ENCODING goes, which Performx does not use.
      #   --enable-libx265    REMOVED: x265 is GPL-2.0. Same story for HEVC.
      #   --enable-libdavs2 / --enable-libuavs3d / --enable-libxavs2 /
      #   --enable-librubberband / --enable-libvidstab / --enable-frei0r /
      #   --enable-libxvid    REMOVED if present: all GPL-only. Decoding needs
      #                       none of them.
      #   -Dgpl=false         ADDED to mpv's meson options: builds mpv's own
      #                       code as LGPL-2.1+ (mpv is dual-licensed; the
      #                       default true produces a GPL binary).
      #   -Drubberband=disabled / -Ddvdnav=disabled
      #                       mpv's OWN optional deps that are GPL-2.0
      #                       (Rubber Band audio stretch; libdvdnav/dvdread):
      #                       linking either would taint the dll regardless of
      #                       -Dgpl=false. Measured enabled in upstream builds
      #                       (the dev dll's mpv-configuration shows both).
      #
      # sed -i with no backup: the workspace is throwaway CI state.
      # ----------------------------------------------------------------------
      - name: Scrub GPL configuration (LGPL build)
        shell: bash
        run: |
          set -euo pipefail
          for flag in \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libdavs2 \
            --enable-libuavs3d \
            --enable-libxavs2 \
            --enable-librubberband \
            --enable-libvidstab \
            --enable-frei0r \
            --enable-libxvid
          do
            sed -i "s/$flag//g" packages/ffmpeg.cmake
          done
          # mpv: LGPL build. Anchor on -Dlibmpv=true, which upstream always passes.
          grep -q -- "-Dlibmpv=true" packages/mpv.cmake
          sed -i "s/-Dlibmpv=true/-Dlibmpv=true -Dgpl=false/" packages/mpv.cmake
          # mpv's GPL-2.0 optional deps out (see the option comments above).
          sed -i "s/-Drubberband=enabled/-Drubberband=disabled/" packages/mpv.cmake
          sed -i "s/-Ddvdnav=enabled/-Ddvdnav=disabled/" packages/mpv.cmake

          # ------------------------------------------------------------------
          # subrandr OFF - need/build, not licence: it is mpv's Rust web-
          # subtitle renderer, which Performx never uses, and its cargo xtask
          # build is fragile (died at package 619/659 on a real run). It is
          # also the ONLY cargo consumer in the package graph, so shedding it
          # drops the whole Rust build surface from the mpv target. Two cuts:
          # the meson feature (so mpv does not look for the library) and the
          # DEPENDS entry (so ninja never schedules the cargo build at all).
          # The DEPENDS delete is anchored to the exact 8-space line so it can
          # never touch the -Dsubrandr= option line. NOTE rustup itself still
          # installs: toolchain/gcc/gcc.cmake lists rustup in the gcc final
          # step's DEPENDS, so the rust cache steps below stay (dead weight
          # to drop later, deliberately not now).
          # ------------------------------------------------------------------
          sed -i "s/-Dsubrandr=enabled/-Dsubrandr=disabled/" packages/mpv.cmake
          grep -q "^        subrandr\$" packages/mpv.cmake
          sed -i "/^        subrandr\$/d" packages/mpv.cmake
          if grep -n "subrandr" packages/mpv.cmake | grep -v -- "-Dsubrandr=disabled"; then
            echo "FAIL: unexpected subrandr reference survived the scrub"; exit 1
          fi

          # ------------------------------------------------------------------
          # BUILD FIX, not licence: drop --enable-libshaderc from ffmpeg.
          # The fork's scripts are frozen at fork time while ffmpeg is cloned
          # from live master, which no longer accepts this option ("Unknown
          # option"). Upstream winbuild updates ffmpeg.cmake in lockstep with
          # ffmpeg; a stale fork decouples them (fix properly by Sync fork,
          # this sed just makes the frozen scripts tolerant). Harmless for
          # Performx: mpv gets its shader support via libplacebo/shaderc
          # directly, not through ffmpeg.
          sed -i "s/--enable-libshaderc//g" packages/ffmpeg.cmake
          if grep -n -- "--enable-libshaderc" packages/ffmpeg.cmake; then
            echo "FAIL: libshaderc option survived the scrub"; exit 1
          fi

          # ------------------------------------------------------------------
          # LICENCE: strip every GPL-only ffmpeg external in one pass. FFmpeg's
          # configure refuses each of these without --enable-gpl (avisynth was
          # the first to trip, proving the backstop: "avisynth is gpl and
          # --enable-gpl is not specified"). Configure stops at the FIRST
          # offender, so scrub the documented complete set in one pass rather
          # than one 40-minute run per library. None is needed by mpv playback
          # for Performx. x264/x265 are also scrubbed above; repeating them
          # here is harmless belt-and-braces, and the guard covers the family.
          # PROVEN on a cold run: the executed configure command contains
          # enables that packages/ffmpeg.cmake does not - dependency packages
          # append their own --enable- flags from their OWN cmake files. The
          # scrub therefore runs repo-wide across packages/, and the family
          # includes libdvdnav/libdvdread (GPL in modern ffmpeg - the captured
          # command showed them queued behind the davs2 refusal).
          for opt in avisynth frei0r libcdio libdavs2 libdvdnav libdvdread \
                     librubberband libvidstab libx264 libx265 libxavs \
                     libxavs2 libxvid; do
            find packages -name "*.cmake" -exec sed -i "s/--enable-$opt//g" {} +
          done
          if grep -rn -E -- "--enable-(avisynth|frei0r|libcdio|libdavs2|libdvdnav|libdvdread|librubberband|libvidstab|libx264|libx265|libxavs2?|libxvid)" packages/; then
            echo "FAIL: a GPL-only ffmpeg enable survived the repo-wide scrub"; exit 1
          fi

          # ------------------------------------------------------------------
          # VARIABLE-CARRIED ENABLE (the one literal seds can never catch):
          # upstream passes davs2 as ${ffmpeg_davs2_cmd}, expanded to
          # --enable-libdavs2 at CMake generate time - the literal exists in
          # no source file, so three scrub generations passed their guards
          # while configure kept receiving the flag (proven by the captured
          # executed command vs the clean proof dump). Delete the variable
          # reference AND the DEPENDS entry so davs2 neither enables nor
          # builds. davs2 is GPL; uavs3d (its sibling variable) is BSD-3 and
          # stays.
          sed -i "/ffmpeg_davs2/d" packages/ffmpeg.cmake
          if grep -n "ffmpeg_davs2" packages/ffmpeg.cmake; then
            echo "FAIL: the davs2 variable reference survived"; exit 1
          fi
          # Belt and braces for the whole class: no OTHER cmake variable may
          # expand to a scrubbed GPL enable. Search variable DEFINITIONS
          # repo-wide for the family and fail loudly if any assignment
          # produces one of the scrubbed flags outside ffmpeg.cmake.
          if grep -rn -E "set\(.*--enable-(avisynth|frei0r|libcdio|libdavs2|libdvdnav|libdvdread|librubberband|libvidstab|libx264|libx265|libxavs2?|libxvid)" cmake/ packages/ 2>/dev/null; then
            echo "FAIL: a variable definition still yields a GPL enable"; exit 1
          fi

          # PROOF DUMP: the transcript must show the post-scrub ffmpeg
          # enables, so a stale-cache execution can never again be confused
          # with a scrub failure.
          echo "--- ALL --enable- options across packages/ after scrub ---"
          grep -rho -- "--enable-[a-z0-9_-]*" packages/ | sort -u || true

          # ------------------------------------------------------------------
          # BUILD FIX, not licence: libcody char8_t shim for the toolchain gcc.
          # The pinned cross gcc (toolchain/gcc/gcc.cmake, a GCC 14 snapshot
          # tarball) bundles a libcody that predates char8_t; the container's
          # host compiler (GCC 16) defaults to C++20+ semantics, where u8"..."
          # literals are const char8_t* and no longer convert to std::string -
          # 'make all-gcc' dies in libcody/client.cc with dozens of "no
          # matching function ... const char8_t" errors. Injecting
          # CXXFLAGS=-O2 -std=gnu++11 as a configure ARGUMENT (autoconf takes
          # VAR=value among the args) restores u8 literals to const char* for
          # gcc's own host code ONLY - other toolchain packages (cppwinrt
          # wants newer standards) are untouched. -O2 is kept because setting
          # CXXFLAGS replaces gcc's default "-g -O2". Warm toolchain caches
          # mask this entirely; it bites on cold builds only.
          # ------------------------------------------------------------------
          grep -q "<SOURCE_DIR>/configure" toolchain/gcc/gcc.cmake
          sed -i 's|<SOURCE_DIR>/configure|<SOURCE_DIR>/configure "CXXFLAGS=-O2 -std=gnu++11"|' toolchain/gcc/gcc.cmake

          echo "--- ffmpeg.cmake flags after scrub (must show NO gpl/x264/x265) ---"
          grep -o -- "--enable-[a-z0-9-]*" packages/ffmpeg.cmake | sort -u
          echo "--- mpv.cmake meson options after scrub (must show -Dgpl=false) ---"
          grep -o -- "-D[a-z_-]*=[a-z0-9]*" packages/mpv.cmake | sort -u
          echo "--- toolchain gcc configure after libcody shim (must show CXXFLAGS) ---"
          grep -n "CXXFLAGS" toolchain/gcc/gcc.cmake

      # ----------------------------------------------------------------------
      # Cache restore - upstream's exact pattern: whole build tree (the built
      # toolchain lives under build_$BIT/install), the downloaded sources, and
      # the rust root. restore-keys fall back to the newest previous cache, so
      # only the very first run is cold.
      # ----------------------------------------------------------------------
      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: build_64
          key: ${{ env.CACHE_VERSION }}-gcc-64_toolchain-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-gcc-64_toolchain

      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: src_packages
          key: ${{ env.CACHE_VERSION }}-repository-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-repository

      - name: Restore rust cache
        uses: actions/cache/restore@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_VERSION }}-clang_root-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-clang_root

      # Environment facts for the failure artifact: if the cold toolchain
      # build dies again, the log bundle says exactly what host compiler and
      # gcc prerequisites the container carried. Diagnostic only - no flags
      # are changed here without an inner log naming the cause.
      - name: Log container build environment
        shell: bash
        run: |
          gcc --version | head -1 || true
          make --version | head -1 || true
          cmake --version | head -1 || true
          ninja --version || true
          pacman -Q gmp mpfr libmpc isl 2>/dev/null || true
          nproc || true
          free -h || true

      # Same configure shape as upstream's mpv_gcc.yml (--fresh regenerates
      # CMake state over a restored build tree exactly as upstream does).
      # SINGLE_SOURCE_LOCATION is where every dependency's source lands - it
      # becomes the corresponding-source bundle below.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -DTARGET_ARCH=${ARCH}-w64-mingw32 \
                -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
                -DRUSTUP_LOCATION="$PWD/clang_root/install_rustup" \
                --fresh -G Ninja -B "build_$BIT" -S "$PWD"

      - name: Download sources
        shell: bash
        run: ninja -C build_$BIT download

      # Upstream's conditional toolchain step, verbatim in shape: build gcc
      # ONLY when the restored cache does not already carry the cross
      # compiler, and drop the huge intermediate toolchain build tree after
      # success so the saved cache stays small. The sentinel path
      # (install/bin/cross-gcc) is upstream's own check.
      - name: Build cross toolchain (cache-cold only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "build_$BIT/install/bin/cross-gcc" ]]; then
            echo "toolchain cache cold: building gcc from scratch (long)"
            ninja -C build_$BIT gcc
            rm -rf build_$BIT/toolchain
          else
            echo "toolchain restored from cache: skipping gcc build"
          fi

      # The standard mpv target already builds libmpv SHARED: upstream's
      # packages/mpv.cmake passes --default-library=shared and -Dlibmpv=true,
      # so libmpv-2.dll falls out of this build. mpv.exe is built alongside
      # but is NOT shipped or uploaded - only the dll leaves this job.
      # Package patch steps apply patches with git am, which refuses to run
      # without an identity (vulkan was the first to bite: exit 128,
      # "unable to auto-detect email address"). Container has none by default.
      - name: Configure git identity (package patch steps use git am)
        shell: bash
        run: |
          git config --global user.email "ci@build.local"
          git config --global user.name "LGPL CI"

      - name: Build mpv (libmpv shared)
        shell: bash
        run: ninja -C build_$BIT mpv

      # ----------------------------------------------------------------------
      # ACCEPTANCE GATE (same checks as Performx's MpvProbe --license): linked
      # GPL codecs leave unmistakable marker strings (libx264 / x265 exist in
      # the binary only when those libraries are compiled in), and any
      # embedded GPL/nonfree configure line is caught wherever it sits. FAIL
      # the job on any hit - a red run here is the tripwire working.
      # ----------------------------------------------------------------------
      - name: Verify LGPL configuration in the built dll
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find "build_$BIT" -name libmpv-2.dll | head -1)
          test -n "$DLL" || { echo "FAIL: libmpv-2.dll not found in build tree"; exit 1; }
          echo "checking: $DLL"
          CONFIG=$(strings -n 8 "$DLL" | grep -m1 -- "--enable-" || true)
          echo "embedded configure fragment: ${CONFIG:-<none found>}"
          for bad in "--enable-gpl" "--enable-nonfree" "libx264" "x265"; do
            if strings -n 8 "$DLL" | grep -q -- "$bad"; then
              echo "FAIL: forbidden token '$bad' present in the built dll - this is a GPL build, do not ship"
              exit 1
            fi
          done
          echo "PASS: dll configuration is LGPL-clean"
          mkdir -p out
          cp "$DLL" out/

      # The LGPL corresponding source: the exact source trees the build
      # consumed (src_packages), plus this repository's build scripts at the
      # exact commit (the scrubbed packages/*.cmake included via git archive
      # would LOSE the scrub, so copy the working tree's packages/ too).
      - name: Bundle corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/libmpv-lgpl-corresponding-source.tar.gz \
              src_packages packages CMakeLists.txt toolchain 2>/dev/null || \
          tar -czf out/libmpv-lgpl-corresponding-source.tar.gz \
              src_packages packages CMakeLists.txt
          ls -la out/

      - name: Upload libmpv-2.dll
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-x86_64
          path: out/libmpv-2.dll
          if-no-files-found: error

      - name: Upload corresponding source bundle
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-corresponding-source
          path: out/libmpv-lgpl-corresponding-source.tar.gz
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # FAILURE FORENSICS: the superbuild buries the real error in per-package
      # ExternalProject logs that never reach the step output (the gcc death
      # printed only "Command failed: 2"; the cause was in
      # build_64/toolchain/gcc-prefix/src/gcc-stamp/gcc-build-*.log). On any
      # failure, gather every stamp log, config.log and *-err.log tail into
      # one artifact so the next failure is diagnosable from the download
      # alone.
      # ----------------------------------------------------------------------
      - name: Collect inner build logs
        if: failure()
        shell: bash
        run: |
          mkdir -p failure-logs
          find "build_$BIT" -path "*-stamp/*.log" -exec cp --parents {} failure-logs/ \; 2>/dev/null || true
          find "build_$BIT" -name "config.log" -exec cp --parents {} failure-logs/ \; 2>/dev/null || true
          # meson and CMake failures self-hide one level deeper than the stamp
          # logs (the stamp log just says the tool failed): grab their own logs.
          find "build_$BIT" -path "*/meson-logs/meson-log.txt" -exec cp --parents {} failure-logs/ \; 2>/dev/null || true
          find "build_$BIT" -name "CMakeError.log" -exec cp --parents {} failure-logs/ \; 2>/dev/null || true
          # the EXACT ExternalProject commands that executed (a restored cache
          # can run commands the current source no longer generates):
          find "build_$BIT" -name "*-configure-*.cmake" -path "*ffmpeg*" -exec cp --parents {} failure-logs/ \; 2>/dev/null || true
          find "build_$BIT" -name "*-err.log" 2>/dev/null | while read -r f; do
            dest="failure-logs/$(dirname "$f")"
            mkdir -p "$dest"
            tail -c 262144 "$f" > "$dest/$(basename "$f").tail"
          done || true
          # tar FIRST: the artifact must exist even if the listing below dies.
          tar -czf failure-logs.tar.gz failure-logs
          echo "--- collected ---"
          # || true is LOAD-BEARING: under pipefail, head closing the pipe
          # early SIGPIPEs find and would fail this step after a successful
          # collection (bitten once via a web edit - do not remove).
          find failure-logs -type f | head -50 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: failure-logs.tar.gz
          if-no-files-found: warn
          retention-days: 7

      # ----------------------------------------------------------------------
      # Cache save - upstream saves on EVERY run outcome, which is what makes
      # a failed cold run recoverable: whatever the toolchain build completed
      # is kept, and the re-run resumes instead of restarting from zero.
      # ----------------------------------------------------------------------
      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build_64
          key: ${{ env.CACHE_VERSION }}-gcc-64_toolchain-${{ github.run_id }}

      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: src_packages
          key: ${{ env.CACHE_VERSION }}-repository-${{ github.run_id }}

      - name: Save rust cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: clang_root
          key: ${{ env.CACHE_VERSION }}-clang_root-${{ github.run_id }}
